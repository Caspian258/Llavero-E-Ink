[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; Mismo chip que firmware/llavero/ (XIAO ESP32C3, USB-Serial/JTAG nativo) —
; necesita los mismos ajustes sin importar qué firmware se flashea. Ver
; firmware/llavero/README.md para la explicación completa de por qué hacen
; falta.
monitor_rts = 0
monitor_dtr = 0
board_upload.after_reset = watchdog_reset
