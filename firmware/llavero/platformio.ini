[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.5.9
; Evita que pio device monitor reafirme RTS/DTR al conectarse. En placas
; ESP32-C3 con USB-CDC nativo (sin chip USB-serie externo), esa reafirmación
; puede reenviar el chip a modo de descarga del ROM en vez de dejarlo correr
; la aplicación ya flasheada.
monitor_rts = 0
monitor_dtr = 0
; El reset "hard_reset" vía USB-Serial/JTAG nativo solo dispara un core
; reset, que no vuelve a muestrear los pines de strapping de arranque: si
; el chip quedó muestreado en modo descarga, se queda atascado ahí sin
; importar cuántas veces se resetee por esta vía. watchdog_reset fuerza un
; reset de sistema completo que sí los vuelve a muestrear.
; https://docs.espressif.com/projects/esptool/en/latest/esp32c3/troubleshooting.html
board_upload.after_reset = watchdog_reset
